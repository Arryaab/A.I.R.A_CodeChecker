[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-lite"
version = "1.0.0"
description = "A.I.R.A. (AI Release Assurance): Production-grade software change verification and release control platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Arya Bhandari", email = "maintainers@aira-verify.dev"}
]
dependencies = [
    "PyYAML>=6.0.0",
    "packaging>=21.0",
]

[project.optional-dependencies]
sandbox = ["docker>=6.0.0"]
ai = ["google-generativeai>=0.3.0"]
web = [
    "flask>=3.0.0",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "uvicorn>=0.20.0"
]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0"
]
all = [
    "docker>=6.0.0",
    "google-generativeai>=0.3.0",
    "flask>=3.0.0",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "uvicorn>=0.20.0",
    "pytest>=7.0.0",
    "build>=1.0.0"
]

[project.scripts]
aira = "aegis.cli:main"
aegis = "aegis.cli:main"

[project.urls]
Homepage = "https://github.com/aira-platform/aira"
Repository = "https://github.com/aira-platform/aira.git"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
norecursedirs = ["fixtures", ".*", "build", "dist", "*.egg"]
addopts = "-v --tb=short"
