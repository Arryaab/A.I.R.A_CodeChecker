[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-lite"
version = "1.0.0"
description = "Production-grade AI change verification and evaluation platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Arya B", email = "arya@aegis-verifier.dev"}
]
dependencies = [
    "PyYAML>=6.0.0",
    "packaging>=21.0",
]

[project.optional-dependencies]
sandbox = ["docker>=6.0.0"]
ai = ["google-generativeai>=0.3.0"]
web = [
    "flask>=3.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0"
]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0"
]
all = [
    "docker>=6.0.0",
    "google-generativeai>=0.3.0",
    "flask>=3.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pytest>=7.0.0",
    "build>=1.0.0"
]

[project.scripts]
aegis = "aegis.cli:main"

[project.urls]
Homepage = "https://github.com/aryab/aegis-lite"
Repository = "https://github.com/aryab/aegis-lite.git"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
