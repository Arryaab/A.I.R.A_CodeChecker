name: Aegis AI Change Verification Guardrail

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  aegis-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Aegis & Dependencies
        run: |
          pip install --upgrade pip
          pip install .[all]

      - name: Run Aegis Test Suite
        run: |
          pytest tests/

      - name: Fetch Git History for Diff Analysis
        run: git fetch --prune --unshallow || git fetch --depth=10

      - name: Run Aegis PR Change Verification Guardrail
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python -m aegis.cli verify --base origin/${{ github.base_ref }} --head HEAD
          else
            python -m aegis.cli verify --base HEAD~1 --head HEAD || true
          fi
