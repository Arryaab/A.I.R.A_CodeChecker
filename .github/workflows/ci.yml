name: Aegis CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install build tooling & verify packaging
      run: |
        python -m pip install --upgrade pip
        python -m pip install build wheel
        python -m build
        python -m pip install dist/*.whl
        python -m pip install pytest flask docker

    - name: Run Aegis unit test suite
      run: |
        python -m pytest tests/ -v

    - name: Validate AegisBench task integrity against canonical schema
      run: |
        python -m aegis.cli benchmark --dir benchmarks/dev --validate
